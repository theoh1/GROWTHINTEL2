<svg xmlns="http://www.w3.org/2000/svg" width="970" height="250" viewBox="0 0 970 250" role="img" aria-labelledby="title desc">
  <title id="title">GrowthIntel partner banner for PCPicker</title>
  <desc id="desc">A premium dark GrowthIntel banner advertising AI growth stock research tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#020713"/>
      <stop offset=".58" stop-color="#071827"/>
      <stop offset="1" stop-color="#03100f"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1">
      <stop offset="0" stop-color="#35f5cf"/>
      <stop offset="1" stop-color="#67e89a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.12 0 0 0 0 0.95 0 0 0 0 0.78 0 0 0 .6 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="970" height="250" rx="28" fill="url(#bg)"/>
  <path d="M0 212 C180 150 270 245 430 174 S720 92 970 132" fill="none" stroke="#35f5cf" stroke-opacity=".13" stroke-width="2"/>
  <path d="M0 210 H970 M0 170 H970 M0 130 H970 M0 90 H970 M0 50 H970 M86 0 V250 M172 0 V250 M258 0 V250 M344 0 V250 M430 0 V250 M516 0 V250 M602 0 V250 M688 0 V250 M774 0 V250 M860 0 V250" stroke="#86fff0" stroke-opacity=".055"/>
  <circle cx="812" cy="64" r="130" fill="#35f5cf" opacity=".08"/>
  <g transform="translate(58 48)">
    <rect x="0" y="0" width="54" height="54" rx="15" fill="#071d22" stroke="#35f5cf" stroke-opacity=".5"/>
    <text x="27" y="36" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" fill="#48f5d0">GI</text>
    <text x="72" y="24" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#f7fbff">GrowthIntel</text>
    <text x="72" y="48" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.8" fill="#35f5cf">AI GROWTH STOCK RESEARCH</text>
  </g>
  <g transform="translate(58 124)">
    <text font-family="Inter, Arial, sans-serif" font-size="35" font-weight="850" fill="#ffffff">Research growth stocks faster</text>
    <text y="38" font-family="Inter, Arial, sans-serif" font-size="18" fill="#b8c7d9">CAN SLIM screening, breakout detection, market news and smart money tracking.</text>
  </g>
  <g transform="translate(642 60)">
    <rect width="258" height="130" rx="20" fill="#071421" stroke="#35f5cf" stroke-opacity=".24"/>
    <path d="M30 96 L72 72 L106 82 L150 45 L184 60 L228 28" fill="none" stroke="url(#teal)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <rect x="32" y="35" width="18" height="62" rx="5" fill="#113342"/>
    <rect x="66" y="58" width="18" height="40" rx="5" fill="#17485a"/>
    <rect x="100" y="47" width="18" height="51" rx="5" fill="#1c5b68"/>
    <rect x="134" y="28" width="18" height="70" rx="5" fill="#207d76"/>
  </g>
  <g transform="translate(642 200)">
    <rect width="258" height="42" rx="21" fill="url(#teal)"/>
    <text x="129" y="27" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="850" fill="#03100f">Start with GrowthIntel</text>
  </g>
