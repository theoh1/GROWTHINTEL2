<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Membership admin · Growth Intel</title><style>body{margin:0;background:#04070d;color:#f5f7fb;font:15px system-ui}.shell{max-width:1200px;margin:auto;padding:24px}.panel{background:#09131f;border:1px solid #243345;border-radius:16px;padding:20px}input,button{padding:10px;border-radius:8px;border:1px solid #34465b;background:#0c1927;color:#fff}button{cursor:pointer;color:#041014;background:#41d7c7;font-weight:700}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:10px;text-align:left;border-bottom:1px solid #243345}.error{color:#ef646c}@media(max-width:700px){.table{overflow:auto}table{min-width:850px}}</style></head><body><main class="shell"><h1>Payment management</h1><p><a href="/membership" style="color:#41d7c7">Membership page</a></p><section class="panel"><form id="search"><input id="query" placeholder="GI reference, email or name" size="36"><button>Search</button></form><p id="status"></p><div class="table"><table><thead><tr><th>Reference</th><th>Member</th><th>Payment</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
'use strict';const base='/api/v1/membership/admin';const status=document.querySelector('#status');async function api(path,options={}){const r=await fetch(base+path,{credentials:'include',headers:{'Content-Type':'application/json'},...options});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.detail||'Request failed');return b}async function load(){try{const q=encodeURIComponent(document.querySelector('#query').value);const items=await api('/payments?q='+q);document.querySelector('#rows').innerHTML=items.map(p=>`<tr><td>${escapeHtml(p.gi_reference)}</td><td>${escapeHtml(p.name)}<br>${escapeHtml(p.email)}</td><td>£${(p.amount_pence/100).toFixed(2)} ${escapeHtml(p.currency)}</td><td>${escapeHtml(p.status)}</td><td>${new Date(p.created_at*1000).toLocaleString()}</td><td>${p.status==='PENDING'?`<button data-id="${p.id}" data-do="approve">Approve</button> <button data-id="${p.id}" data-do="reject">Reject</button>`:''}</td></tr>`).join('');status.textContent=`${items.length} payment(s)`}catch(e){status.textContent=e.message;status.className='error'}}function escapeHtml(s){const d=document.createElement('div');d.textContent=String(s);return d.innerHTML}document.querySelector('#search').addEventListener('submit',e=>{e.preventDefault();load()});document.querySelector('#rows').addEventListener('click',async e=>{const b=e.target.closest('[data-do]');if(!b)return;if(!confirm(`${b.dataset.do==='approve'?'Approve':'Reject'} payment #${b.dataset.id}? This action cannot be undone.`))return;const note=prompt('Optional audit note:')||'';try{b.disabled=true;await api(`/payments/${b.dataset.id}/${b.dataset.do}`,{method:'POST',body:JSON.stringify({note})});await load()}catch(err){status.textContent=err.message;b.disabled=false}});load();
</script></body></html>
